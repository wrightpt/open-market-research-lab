{
  "name": "Synthetic engineering checks",
  "on": {
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "synthetic-ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "stdlib": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read"
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.11",
            "3.14"
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout v7.0.1 with no persisted credentials",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Set up Python with setup-python v7.0.0",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Stdlib unit and boundary tests",
          "run": "python3 -m unittest discover -s tests -v"
        },
        {
          "name": "Verify fixture custody and submission",
          "run": "python3 -m market_lab verify-data\npython3 -m market_lab validate submissions/baseline.json"
        },
        {
          "name": "Development smoke only",
          "run": "python3 -m market_lab backtest submissions/baseline.json --output artifacts/ci-development.json"
        },
        {
          "name": "Whitespace review",
          "run": "git diff --check"
        }
      ]
    },
    "synthetic-mcp": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Checkout without persisted credentials",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Set up Node 22",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Install pinned MCP dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts --no-audit --no-fund",
          "working-directory": "integrations/synthetic-mcp"
        },
        {
          "name": "MCP syntax and official-client integration tests",
          "run": "npm run check",
          "working-directory": "integrations/synthetic-mcp"
        }
      ]
    }
  }
}
